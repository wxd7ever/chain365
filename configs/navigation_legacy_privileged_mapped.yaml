  # Smooth staged profile shared by every post-skill preset. Each return uses
  # quintic Cartesian references and bounded action slew; fixed orientations
  # are applied only after translation, while carry preserves grasp orientation.
  presets:
    carry:
      # Median initial/home EEF pose from 511 official SteamInMicrowave human
      # demonstrations. It is compact and high enough for base transport.
      target_position: [0.2465, -0.0040, 0.5959]
      # Preserve the grasp orientation while carrying; rotating a loaded bowl
      # toward a global fixed quaternion causes unnecessary swing.
      orientation_mode: preserve_skill_end
      target_quaternion_xyzw: [-0.98954, -0.03339, -0.13870, 0.02138]
      pre_lift_height: 0.10
      pre_lift_minimum_z: 0.35
      pre_lift_max_steps: 280
      pre_lift_trajectory_steps: 60
      return_max_steps: 480
      return_translation_trajectory_steps: 120
      return_orientation_trajectory_steps: 60
      translation_tolerance_m: 0.025
      orientation_tolerance_deg: 12.0
      max_translation_command: 0.045
      max_rotation_command: 0.035
      # Limit the change between adjacent OSC actions; caps alone do not
      # constrain acceleration or jerk.
      max_translation_command_delta: 0.006
      max_rotation_command_delta: 0.004
      translation_gain: 3.0
      rotation_gain: 1.5
      stable_steps: 8
      hold_steps: 20
      hold_mode: zero_delta
      hold_confirmation_steps: 2
      drop_confirmation_steps: 30
    released:
