navigation:
  enabled: true
  # Persist every target-aware navigation decision, including skipped and
  # failed plans, under the episode run directory for visual inspection.
  save_debug_artifacts: true
  debug_artifact_subdir: navigation_planning
  # Current baseline: execute manipulation directly from the selected coarse
  # navigation pose. Dedicated ablations can override this from the CLI with
  # --enable_local_refiner.
  enable_local_refiner: false
  # Do not disturb an already-valid work pose. Refine only after the base
  # actually executes a coarse global-navigation path.
  local_refiner_after_navigation_only: true
  # Keep the legacy pipeline simple: after an actual successful coarse
  # navigation, let the VLM refine the work pose even while carrying an object.
  # Held-object monitoring remains active during base motion, but transport
  # readiness is not a prerequisite for invoking the refiner.
  local_refiner_require_transport_ready_when_holding: false
  local_refiner_failure_policy: use_coarse_pose
  waypoint_position_tolerance: 0.12
  final_position_tolerance: 0.08
  # Same-order inner tolerance leaves 1 cm for settle drift before 8 cm acceptance.
  controller_final_position_tolerance: 0.07
  final_yaw_tolerance_deg: 10.0
  max_waypoint_retries: 1
  # Normalized base-action limits used only by Target-Aware Navigation.
  # Keep larger step budgets when lowering these limits so long paths do not
  # fail simply because the base is moving more gently.
  waypoint_max_steps: 240
  final_position_max_steps: 320
  final_yaw_max_steps: 320
  max_translation_command: 0.55
  max_rotation_command: 0.35
  # Face each path segment before translating, then hold that segment yaw
  # during XY motion. This avoids long saturated lateral / reverse commands.
  align_yaw_to_path: true
  segment_heading_tolerance_deg: 10.0
  segment_heading_max_steps: 240
  # If the real footprint starts in shallow overlap, keep yaw fixed and move
  # only through samples whose raw-map overlap never increases.
  start_collision_recovery:
    enabled: true
    search_step_m: 0.025
    execution_step_m: 0.05
    max_distance_m: 0.30
    max_steps_per_move: 80
    translation_tolerance_m: 0.02
    yaw_tolerance_deg: 3.0
    max_translation_command: 0.20
    require_monotonic_overlap_decrease: true
    direction_order: [backward, left, right, forward]
  skip_facing_cosine: 0.50
  # Preserve navigation failures in diagnostics, but continue the atomic policy
  # when conservative map/path planning cannot produce a collision-free route.
  # Motion, object-drop, and transport-preparation failures remain blocking.
  continue_policy_after_failure_reasons: []
  held_object_guard: true
  # Keep the gripper closed while navigating with a latched object. Drop
  # detection still terminates navigation through OBJECT_DROPPED.
  held_object_guard_action_override: true
  hold_confirmation_steps: 2
  drop_confirmation_steps: 30
