# Compatibility profile: SteamInMicrowave_4 privileged runtime (2026-08-26).
# Only the navigation backend differs: occupancy map + candidates + A* + base controller.
# VLM local work-pose refinement runs after coarse navigation; post-skill
# arm-return modules remain intentionally disabled.

map:
  # Throughput-oriented compatibility setting: use a finer 2.5 cm grid so a
  # valid start / corridor is less likely to disappear through quantization.
  resolution: 0.025
  boundary_padding: 1.00
  border_obstacle_cells: 1
  # Floor fixtures define room bounds but are traversable and not obstacles.
  traversable_fixture_types: [Floor]
  # Cache only fixture layout footprints. Door / drawer / rack collision geoms
  # are read from the current MuJoCo world transforms before every navigation.
  articulated_enabled: true
  articulated_min_projected_area_m2: 0.001
  articulated_min_projected_span_m: 0.015
  # Used only if live robot collision geoms cannot be queried. Production runs
  # derive the current mobile-manipulator z envelope from MuJoCo automatically.
  robot_collision_z_fallback: [0.0, 1.8]
  debug_articulated_map: false

robot:
  # Use the real Omron collision-box half-size. The earlier half-scale
  # compatibility footprint admitted routes that the MuJoCo robot could not
  # physically execute and was a major source of MOTION_STALLED failures.
  half_length: 0.35
  half_width: 0.25
  # Retained as the legacy fallback for external callers.
  radius: 0.4301162634
  safety_margin: 0.01
  # Collision-box center relative to the mobile-base control origin.
  # Read from robosuite's omron_mobile_base.xml (wheeled_base pos=-0.20 0 0.192).
  footprint_center_offset_xy: [-0.20, 0.0]

candidate_generation:
  # Refiner-free baseline: navigate directly into the nominal manipulation
  # range expected by the policy.
  min_distance: 0.50
  preferred_distance: 0.70
  max_distance: 0.95
  radial_step: 0.05
  angular_step_deg: 10

fixture_candidate:
  # Without local refinement, stop directly in the fixture work range.
  min_distance: 0.45
  preferred_distance: 0.70
  max_distance: 1.00
  distance_step: 0.05
  lateral_range: 0.60
  lateral_step: 0.10

candidate_scoring:
  w_clearance: 1.0
  w_facing: 0.5
  w_distance: 1.0
  w_path: 0.75
  clearance_saturation_m: 1.00

post_grasp_transport:
  enabled: true
  # Base-relative Cartesian motion executed only before a required global
  # navigation while holding an object.
  lift_height: 0.10
  retract_distance: 0.08
  minimum_planar_radius: 0.35
  # Readiness is based on achieved safety, not exact Cartesian convergence.
  minimum_object_lift_m: 0.03
  minimum_object_clearance_m: 0.03
  maximum_transport_planar_radius: 0.70
  lift_max_steps: 160
  retract_max_steps: 160
  translation_tolerance_m: 0.025
  orientation_tolerance_deg: 12.0
  max_translation_command: 0.12
  max_rotation_command: 0.10
  stable_steps: 5
  hold_steps: 10
  # Freeze the final carry pose with zero Cartesian increments. This avoids
  # small closed-loop corrections caused by noisy pose observations.
  hold_mode: zero_delta
  hold_confirmation_steps: 2
  drop_confirmation_steps: 30
  # The next required navigation must first establish this safety-based carry
  # posture. Exact Cartesian convergence is diagnostic rather than mandatory.
  enforce_before_navigation: true

post_place_retreat:
  enabled: false
  # A failed best-effort retreat must not invalidate a verified Place. It is
  # retried only if the next atomic skill actually requires base navigation.
  failure_policy: warn
  # Executed immediately after a successful Place verifier. Keep the gripper
  # open, lift away from the receptacle, then compact the arm toward the base.
  lift_height: 0.10
  retract_distance: 0.12
  minimum_planar_radius: 0.35
  minimum_eef_lift_m: 0.03
  maximum_retreat_planar_radius: 0.72
  lift_max_steps: 160
  retract_max_steps: 180
  translation_tolerance_m: 0.025
  orientation_tolerance_deg: 12.0
  max_translation_command: 0.12
  max_rotation_command: 0.10
  stable_steps: 5
  hold_steps: 10
  # Keep the open gripper and arm stationary after the retreat.
  hold_mode: zero_delta

# Unified handoff used after every verified manipulation skill. Each atomic
# task maps to an explicit, fixed base-frame EEF position. Motion still goes
# through the existing Cartesian controller; joints are never reset directly.
# Pick keeps the gripper closed. Other completed skills return with it open.
post_skill_return:
  # The legacy mapped-navigation profile uses post_grasp_transport for Pick
  # handoff because it accepts achieved safe lift / compactness without
  # requiring exact convergence to a fixed EEF pose.
  enforce_result: false
  enabled: false
  defer_until_navigation: false
  # Compatibility policy used only when enforce_result is true.
  failure_policy: block
  # Every verified non-pick skill shares the exact PlaceObject return pose and
  # motion settings. PickObject remains the only carry/closed-gripper preset.
  # Shared handoff / settled-motion criteria for the deferred carry transition.
  motion_stability:
    linear_velocity_threshold_m_s: 0.05
    angular_velocity_threshold_deg_s: 20.0
    near_target_slowdown_radius_m: 0.08
    near_target_slowdown_radius_deg: 30.0
    handoff_max_steps: 30
    handoff_stable_steps: 2
    handoff_action_tolerance: 0.006
    simulation_timestep_s: 0.05
  default_preset: released
  task_presets:
