navigation:
  enabled: true
  enable_local_refiner: true
  local_refiner_failure_policy: use_coarse_pose
  waypoint_position_tolerance: 0.12
  final_position_tolerance: 0.08
  # Same-order inner tolerance leaves 1 cm for settle drift before 8 cm acceptance.
  controller_final_position_tolerance: 0.07
  final_yaw_tolerance_deg: 10.0
  max_waypoint_retries: 1
  # Normalized base-action limits used only by Target-Aware Navigation.
  # Keep larger step budgets when lowering these limits so long paths do not
  # fail simply because the base is moving more gently.
  waypoint_max_steps: 240
  final_position_max_steps: 320
  final_yaw_max_steps: 320
  max_translation_command: 0.55
  max_rotation_command: 0.35
  skip_facing_cosine: 0.50
  # Preserve navigation failures in diagnostics, but continue the atomic policy
  # when conservative map/path planning cannot produce a collision-free route.
  # Motion, object-drop, and transport-preparation failures remain blocking.
  continue_policy_after_failure_reasons:
    - START_IN_COLLISION
    - GOAL_IN_COLLISION
    - NO_VALID_WORK_POSE
    - PATH_NOT_FOUND
    - PATH_INVALIDATED_BY_SCENE_STATE
  held_object_guard: true
  # Keep the gripper closed while navigating with a latched object. Drop
  # detection still terminates navigation through OBJECT_DROPPED.
  held_object_guard_action_override: true
  hold_confirmation_steps: 2
  drop_confirmation_steps: 2
